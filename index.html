<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reel Room</title>
<style>
  :root {
    --bg: #0a0a0a;
    --amber: #ff6b1a;
    --amber-light: #ff8c42;
    --amber-deep: #e85d04;
    --text: #ff7a2f;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: system-ui, -apple-system, sans-serif;
    line-height: 1.5;
    padding: 1.5rem;
    min-height: 100vh;
  }
  h1 {
    color: var(--amber);
    font-size: 2rem;
    margin-bottom: 0.25rem;
    letter-spacing: -0.02em;
  }
  .subtitle {
    color: var(--amber-light);
    opacity: 0.8;
    margin-bottom: 1.5rem;
  }
  section {
    background: #111;
    border: 1px solid #2a1a10;
    border-radius: 12px;
    padding: 1.25rem;
    margin-bottom: 1.25rem;
  }
  h2 {
    color: var(--amber);
    font-size: 1.1rem;
    margin-bottom: 0.75rem;
  }
  label {
    display: block;
    color: var(--amber-light);
    font-size: 0.9rem;
    margin-bottom: 0.4rem;
  }
  input[type="range"] {
    width: 100%;
    accent-color: var(--amber);
    margin: 0.5rem 0;
  }
  .duration-display {
    font-size: 1.4rem;
    color: var(--amber);
    font-weight: 600;
    text-align: center;
    margin: 0.5rem 0;
  }
  textarea, input[type="text"] {
    width: 100%;
    background: #0d0d0d;
    border: 1px solid #3a2a1a;
    color: var(--text);
    border-radius: 8px;
    padding: 0.75rem;
    font-family: inherit;
    font-size: 0.95rem;
    resize: vertical;
  }
  textarea:focus, input:focus {
    outline: none;
    border-color: var(--amber);
  }
  button {
    background: var(--amber-deep);
    color: #111;
    border: none;
    padding: 0.7rem 1.2rem;
    border-radius: 8px;
    font-weight: 600;
    cursor: pointer;
    margin-right: 0.5rem;
    margin-top: 0.5rem;
  }
  button:hover { background: var(--amber); }
  button.secondary {
    background: #222;
    color: var(--amber);
    border: 1px solid var(--amber-deep);
  }
  .preview {
    margin-top: 1rem;
    padding: 0.75rem;
    background: #0a0a0a;
    border-radius: 8px;
    border: 1px dashed #3a2a1a;
    color: var(--amber-light);
    font-size: 0.85rem;
    white-space: pre-wrap;
    word-break: break-word;
  }
  .record-status {
    margin-top: 0.5rem;
    font-size: 0.85rem;
    color: var(--amber);
  }
</style>
</head>
<body>
  <h1>Reel Room</h1>
  <p class="subtitle">Black + reddish-orange amber • Video + Music</p>

  <section>
    <h2>Video Duration</h2>
    <label for="duration">Length (10 seconds – 2 minutes)</label>
    <input type="range" id="duration" min="10" max="120" value="30" step="5">
    <div class="duration-display" id="durationValue">30 seconds</div>
  </section>

  <section>
    <h2>Video Prompt</h2>
    <textarea id="videoPrompt" rows="4" placeholder="Describe the video scene... (photorealistic, lighting, action, etc.)"></textarea>
    <button onclick="copyVideoPrompt()">Copy Video Prompt</button>
  </section>

  <section>
    <h2>Music / Song Prompt (for MusicGPT)</h2>
    <textarea id="musicPrompt" rows="4" placeholder="Describe the song style, mood, instruments, vocals..."></textarea>
    <button onclick="copyMusicPrompt()">Copy Music Prompt</button>
  </section>

  <section>
    <h2>Quick Editor Notes</h2>
    <textarea id="notes" rows="3" placeholder="Notes for editing the video or song..."></textarea>
  </section>

  <section>
    <h2>Record</h2>
    <button id="recordBtn" onclick="toggleRecord()">Start Recording</button>
    <button class="secondary" onclick="downloadRecording()" id="downloadBtn" disabled>Download Recording</button>
    <div class="record-status" id="recordStatus">Not recording</div>
  </section>

  <div class="preview" id="preview">
    Duration: 30 seconds
    Video prompt ready to copy.
    Music prompt ready to copy.
  </div>

<script>
const durationSlider = document.getElementById('duration');
const durationValue = document.getElementById('durationValue');
const preview = document.getElementById('preview');

durationSlider.addEventListener('input', () => {
  const secs = parseInt(durationSlider.value);
  const label = secs >= 60 
    ? `${Math.floor(secs/60)} min ${secs%60} sec` 
    : `${secs} seconds`;
  durationValue.textContent = label;
  updatePreview();
});

function updatePreview() {
  const secs = durationSlider.value;
  const video = document.getElementById('videoPrompt').value.trim() || '(no video prompt yet)';
  const music = document.getElementById('musicPrompt').value.trim() || '(no music prompt yet)';
  preview.textContent = `Duration: ${secs} seconds\n\nVideo:\n${video}\n\nMusic:\n${music}`;
}

document.getElementById('videoPrompt').addEventListener('input', updatePreview);
document.getElementById('musicPrompt').addEventListener('input', updatePreview);

function copyVideoPrompt() {
  const text = document.getElementById('videoPrompt').value;
  navigator.clipboard.writeText(text);
  alert('Video prompt copied');
}

function copyMusicPrompt() {
  const text = document.getElementById('musicPrompt').value;
  navigator.clipboard.writeText(text);
  alert('Music prompt copied');
}

// Simple recording (audio only for now — browser MediaRecorder)
let mediaRecorder;
let chunks = [];
let recording = false;

async function toggleRecord() {
  const btn = document.getElementById('recordBtn');
  const status = document.getElementById('recordStatus');
  const downloadBtn = document.getElementById('downloadBtn');

  if (!recording) {
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      chunks = [];
      mediaRecorder.ondataavailable = e => chunks.push(e.data);
      mediaRecorder.onstop = () => {
        const blob = new Blob(chunks, { type: 'audio/webm' });
        window.recordedBlob = blob;
        downloadBtn.disabled = false;
        status.textContent = 'Recording saved. Ready to download.';
      };
      mediaRecorder.start();
      recording = true;
      btn.textContent = 'Stop Recording';
      status.textContent = 'Recording...';
    } catch (err) {
      status.textContent = 'Mic permission needed or not supported.';
    }
  } else {
    mediaRecorder.stop();
    recording = false;
    btn.textContent = 'Start Recording';
  }
}

function downloadRecording() {
  if (!window.recordedBlob) return;
  const url = URL.createObjectURL(window.recordedBlob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'reel-room-recording.webm';
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
